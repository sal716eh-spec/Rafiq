<script>
DATA.forEach(u=>Object.assign(u,(typeof EXTRA!=='undefined'&&EXTRA[u.n])||{}));
const qs=new URLSearchParams(location.search);
const stage=document.getElementById('stage'), bar=document.getElementById('bar');
const say=(t,el)=>{ if(window.RQ) RQ.speak(t.replace(/=/g,' '),el); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setBar(i,n){ bar.style.width=Math.round(100*i/Math.max(1,n))+'%'; }
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function screen(body, buttons){
  stage.innerHTML='';
  stage.appendChild(body);
  const f=document.createElement('div'); f.className='foot';
  buttons.forEach(b=>f.appendChild(b)); stage.appendChild(f);
  window.scrollTo(0,0);
}
function button(label, fn, ghost){ const b=document.createElement('button'); b.className='go'+(ghost?' ghost':''); b.type='button'; b.textContent=label; b.onclick=fn; return b; }

/* ── steps ─────────────────────────────────────────────── */
function runWords(p, step){
  const words=RafiqPath.wordsOf(p, step.batch);
  const total=words.length*2;            // meet each word, then a short check
  let i=0;
  const meet=()=>{
    if(i>=words.length) return check(0);
    const w=words[i]; setBar(i,total);
    const pic=PIC[w.id]?`<div class="pic" aria-hidden="true">${PIC[w.id]}</div>`:'';
    const body=el(`<div><p class="kicker">New word ${i+1} of ${words.length}</p>
      <div class="card">${pic}<div class="big" id="w">${esc(w.ar)}</div>
      <div class="tr">${esc(w.tr||'')}</div><div class="en">${esc(w.en)}</div>
      <button class="hear" type="button" id="h">🔊 Hear it again</button></div>
      <p class="kicker" style="margin-top:14px;text-align:center">Say it aloud once, then carry on</p></div>`);
    screen(body,[button(i<words.length-1?'Next word':'Check yourself',()=>{i++;meet()})]);
    const a=body.querySelector('#w'); a.onclick=()=>say(w.ar,a); body.querySelector('#h').onclick=()=>say(w.ar,a);
    say(w.ar,a);
  };
  // Light check straight after meeting: pick the meaning. Learning, not a test —
  // a miss just shows the answer and moves on.
  const order=shuffle(words);
  const check=k=>{
    if(k>=order.length){
      words.forEach(w=>{ if(Progress.isNew('v:'+w.id)){ Progress.grade('v:'+w.id,'good'); RafiqPath.wordMet(); } });  // into daily review
      return finish(p, step);
    }
    setBar(words.length+k,total);
    const w=order[k];
    const pool=shuffle(words.filter(x=>x!==w && x.en!==w.en)).slice(0,3).concat([w]);
    const body=el(`<div><p class="kicker">What does this mean?</p>
      <div class="card"><div class="big" id="w">${esc(w.ar)}</div></div><div class="opts" id="o"></div></div>`);
    const a=body.querySelector('#w'); a.onclick=()=>say(w.ar,a);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(pool).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=x.en.split('/')[0];
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===w?'right':'wrong');
        if(x!==w) [...body.querySelectorAll('.opt')].find(o=>o.textContent===w.en.split('/')[0]).classList.add('right');
        say(w.ar,a); next.disabled=false; };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet();
}

function runListen(p, step){
  const u=RafiqPath.unitData(p.n), lines=u.dialogue, c=u.convos&&u.convos[0];
  let i=0, showEn=true;
  const show=()=>{
    if(i>=lines.length) return finish(p, step);
    setBar(i,lines.length);
    const l=lines[i];
    const body=el(`<div><p class="kicker">${esc(c?c.sub:'Conversation')} · line ${i+1} of ${lines.length}</p>
      <div class="card"><div class="who">${esc(l[0])}</div><div class="mid" id="a">${esc(l[1])}</div>
      <div class="en${showEn?'':' hide'}" id="e">${esc(l[2])}</div>
      <button class="hear" type="button" id="h">🔊 Again</button></div>
      <p class="kicker" style="margin-top:14px;text-align:center">Listen, then say it after the voice</p></div>`);
    const a=body.querySelector('#a'); a.onclick=()=>say(l[1],a); body.querySelector('#h').onclick=()=>say(l[1],a);
    const tog=button(showEn?'Hide English':'Show English',()=>{showEn=!showEn;body.querySelector('#e').classList.toggle('hide',!showEn);tog.textContent=showEn?'Hide English':'Show English'},true);
    screen(body,[button(i<lines.length-1?'Next line':'Finish',()=>{i++;show()}),tog]);
    say(l[1],a);
  };
  show();
}

function runGrammar(p, step){
  const notes=RafiqPath.unitData(p.n).grammar||[];
  let i=0;
  const show=()=>{
    if(i>=notes.length) return finish(p, step);
    setBar(i,notes.length);
    const g=notes[i];
    const body=el(`<div><p class="kicker">How it works · ${i+1} of ${notes.length}</p>
      <div class="card note"><h3>${esc(g.t)}</h3><div class="mid" id="a">${esc(g.ar.replace(/=/g,' '))}</div><p>${esc(g.en)}</p></div></div>`);
    const a=body.querySelector('#a'); a.onclick=()=>say(g.ar,a);
    screen(body,[button(i<notes.length-1?'Next':'Finish',()=>{i++;show()})]);
  };
  show();
}

/* Reading starter: meet each letter (shape, name, sound, forms, a word that
   starts with it), then pick letters by sound. */
const ZWJ='\u200d';
function forms(l, joins){
  return joins ? [l, l+ZWJ, ZWJ+l+ZWJ, ZWJ+l] : [l, ZWJ+l];
}
function runLetters(p, step){
  const g=ALPHABET_GROUPS[step.group], L=g.letters, total=L.length*2;
  let i=0;
  const meet=()=>{
    if(i>=L.length) return check(0);
    setBar(i,total);
    const [ch,name,sound,ex,exEn]=L[i], joins=!sound.includes('*');
    const f=forms(ch,joins);
    const labels=joins?['alone','start','middle','end']:['alone','end'];
    const body=el(`<div><p class="kicker">${esc(g.title)} · ${i+1} of ${L.length}</p>
      <div class="card"><div class="big" id="w" style="font-size:72px">${ch}</div>
      <div class="mid" style="font-size:20px">${esc(name)}</div>
      <div class="en" style="font-size:16px">${esc(sound.replace(' *',''))}</div>
      <div style="display:flex;justify-content:center;gap:14px;margin-top:14px;direction:rtl">
        ${f.map((x,k)=>`<div><div class="mid" style="cursor:default">${x}</div><div class="tr">${labels[k]}</div></div>`).join('')}</div>
      ${joins?'':'<p class="tr">Doesn\'t join to the letter after it</p>'}
      <div style="margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px">
        <div class="mid" id="x">${esc(ex)}</div><div class="tr">${esc(exEn)}</div></div></div></div>`);
    const a=body.querySelector('#w'); a.onclick=()=>say(name,a);
    const x=body.querySelector('#x'); x.onclick=()=>say(ex,x);
    screen(body,[button(i<L.length-1?'Next letter':'Check yourself',()=>{i++;meet()})]);
    say(name,a);
  };
  const order=shuffle(L);
  const check=k=>{
    if(k>=order.length) return finish(p, step);
    setBar(L.length+k,total);
    const t=order[k];
    const body=el(`<div><p class="kicker">Which letter is this?</p>
      <div class="card"><div class="en" style="margin:0">${esc(t[2].replace(' *','').split(' — ')[0])}</div>
      <div class="tr">the first sound of the word for "${esc(t[4])}"</div></div><div class="opts" id="o"></div></div>`);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(L).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.style.fontFamily='var(--ar)'; b.style.fontSize='28px'; b.textContent=x[0];
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===t?'right':'wrong');
        if(x!==t) [...body.querySelectorAll('.opt')].find(o=>o.textContent===t[0]).classList.add('right');
        say(t[1],null); next.disabled=false; };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet();
}
function runVowels(p, step){
  const V=VOWEL_MARKS, total=V.length+5;
  let i=0;
  const meet=()=>{
    if(i>=V.length) return check(0);
    setBar(i,total);
    const [w,sound,what]=V[i];
    const body=el(`<div><p class="kicker">The vowel marks · ${i+1} of ${V.length}</p>
      <div class="card"><div class="big" style="font-size:80px;cursor:default">${w}</div>
      <div class="en">"${esc(sound)}"</div><p style="color:var(--ink-soft);margin-top:10px">${esc(what)}</p></div>
      <p class="kicker" style="margin-top:14px;text-align:center">Most books for learners — and this app — show every vowel</p></div>`);
    screen(body,[button(i<V.length-1?'Next':'Check yourself',()=>{i++;meet()})]);
  };
  const order=shuffle(V).slice(0,5);
  const check=k=>{
    if(k>=order.length) return finish(p, step);
    setBar(V.length+k,total);
    const t=order[k];
    const body=el(`<div><p class="kicker">Which one says "${esc(t[1])}"?</p><div class="opts" id="o"></div></div>`);
    const next=button('Next',()=>check(k+1)); next.disabled=true;
    shuffle(V.filter(x=>x!==t)).slice(0,3).concat([t]).sort(()=>Math.random()-.5).forEach(x=>{
      const b=document.createElement('button'); b.className='opt'; b.type='button';
      b.style.fontFamily='var(--ar)'; b.style.fontSize='30px'; b.textContent=x[0];
      b.onclick=()=>{ if(!next.disabled) return;
        b.classList.add(x===t?'right':'wrong');
        if(x!==t) [...body.querySelectorAll('.opt')].find(o=>o.textContent===t[0]).classList.add('right');
        next.disabled=false; };
      body.querySelector('#o').appendChild(b);
    });
    screen(body,[next]);
  };
  meet();
}

/* Conversation partner: the other speaker's lines are the unit's own
   conversation, read aloud; the learner answers in their own words and the
   judge says whether the reply fits and how the grammar looks. Nothing is
   generated — if it doesn't fit, a suggested reply from the conversation is
   one tap away. */
/* opts (scenes): {lines, title, done} — a real-life scene instead of the unit's conversation */
function runChat(p, step, opts){
  const lines=opts ? opts.lines : RafiqPath.unitData(p.n).dialogue;
  const situation=opts ? opts.situation : (()=>{ const u=RafiqPath.unitData(p.n); return u.en+': '+((u.convos&&u.convos[0].sub)||''); })();
  const done=opts ? opts.done : ()=>finish(p, step);
  const turns=[]; for(let i=0;i+1<lines.length;i+=2) turns.push([lines[i],lines[i+1]]);
  const judge=window.RafiqJudge&&RafiqJudge.on;
  // The conversation partner is part of Complete (everyone has Complete during the beta).
  if(judge && window.RafiqPlan && !RafiqPlan.isComplete()){
    const c=RafiqPlan.PRICES.complete;
    const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'}</p><div class="card">
      <div style="font-size:40px">💬</div><h3 style="margin:8px 0">Part of Rafiq Complete</h3>
      <p style="color:var(--ink-soft)">Reply to the other speaker in your own words and get feedback on every reply.
      ${c.yearly} a year or ${c.monthly} a month.</p></div></div>`);
    screen(body,[button('See Complete',()=>{location.href='index.html#pricing'}),
      opts ? button('Back to practice',()=>{location.href='practise.html'},true) : button('Skip this step',done,true)]);
    return;
  }
  let t=0;
  const body=el(`<div><p class="kicker">${opts?esc(opts.title):'Have the conversation'} · you reply</p><div class="chat" id="chat"></div>
    <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ رَدَّكَ هُنا" style="min-height:70px"></textarea></div>`);
  const chat=body.querySelector('#chat'), ta=body.querySelector('textarea');
  const add=(cls,ar,en)=>{ const b=el(`<div class="bub ${cls}">${ar?`<div class="a">${esc(ar)}</div>`:''}${en?`<div class="e">${esc(en)}</div>`:''}</div>`);
    chat.appendChild(b); b.scrollIntoView({block:'nearest'}); return b; };
  const send=button(judge?'Send':'Show a suggested reply',()=>reply());
  const hint=button('Hint',()=>{ add('note','',"Say something like: "+turns[t][1][2]); },true);
  const next=button('Continue',()=>{ t++; turn(); });
  function them(){
    const [a]=turns[t]; setBar(t,turns.length);
    const b=add('them',a[1],a[2]); b.onclick=()=>say(a[1],b); say(a[1],b);
    ta.value=''; ta.classList.remove('hide');
    screen(body,[send,hint]);
  }
  function turn(){ if(t>=turns.length) return done(); them(); }
  async function reply(){
    const [a,sug]=turns[t], said=ta.value.trim();
    if(!judge){ add('me',sug[1],'Suggested: '+sug[2]); say(sug[1],null); ta.classList.add('hide'); screen(body,[next]); return; }
    if(!said) return;
    add('me',said,'');
    ta.classList.add('hide');
    const wait=add('note','','Checking…');
    const v=await RafiqJudge.reply(a[1],a[2],sug[1],said,situation);
    wait.remove();
    if(!v){ add('note','','Couldn\'t check just now. One way to reply: '+sug[1]+' — '+sug[2]); screen(body,[next]); return; }
    if(!v.fits){
      const n=add('note no','',"That doesn't quite answer what they said. Try again, or here's one way:");
      const s=add('them',sug[1],sug[2]); s.onclick=()=>say(sug[1],s);
      ta.classList.remove('hide'); ta.value='';
      screen(body,[send,button('Carry on',()=>{t++;turn()},true)]);
      return;
    }
    add('note '+(v.grammar==='slip'?'no':'ok'),'',
      v.grammar==='ok'?'✓ Good reply.' : v.grammar==='slip'?'✓ Good reply — but check this: '+v.why : '✓ That works.');
    screen(body,[next]);
  }
  turn();
}

function runPractise(p){
  location.href='session.html?unit='+p.n+'&n=10';
}

function runSpeak(p, step){
  const u=RafiqPath.unitData(p.n), prompts=(u.prompts||[]).slice(0,2);
  let i=0;
  const judge=window.RafiqJudge&&RafiqJudge.on;
  const DONE=['Not the task yet — read the question again.','Partly there — the task asks for a bit more.','Task done ✓'];
  const show=()=>{
    if(i>=prompts.length) return finish(p, step);
    setBar(i,prompts.length);
    const [tAr,tEn,exAr,exEn]=prompts[i];
    const body=el(`<div><p class="kicker">Say it yourself · ${i+1} of ${prompts.length}</p>
      <div class="card" style="text-align:left"><div style="font-size:18px;font-weight:600">${esc(tEn)}</div>
      <div class="mid" style="text-align:right;font-size:18px;color:var(--rubric)">${esc(tAr)}</div>
      <textarea class="ar-in" dir="rtl" placeholder="اكْتُبْ جَوابَكَ هُنا"></textarea>
      <div id="out"></div>
      <div id="ex" class="hide" style="margin-top:14px;border-top:1px dashed var(--rule);padding-top:12px">
        <p class="kicker">One way to answer</p><div class="mid" id="exa" style="text-align:right">${esc(exAr)}</div>
        <div style="color:var(--ink-soft);font-size:14px">${esc(exEn)}</div></div></div>
      <p class="kicker" style="margin-top:14px;text-align:center">Say it aloud first, then type it</p></div>`);
    const ta=body.querySelector('textarea'), out=body.querySelector('#out');
    const exa=body.querySelector('#exa'); exa.onclick=()=>say(exAr,exa);
    const btns=[];
    if(judge) btns.push(button('Check my answer',()=>{
      if(!ta.value.trim()) return;
      out.innerHTML='<div class="verdict">Checking…</div>';
      RafiqJudge.prompt(tEn,exAr,ta.value).then(v=>{
        if(!v){ out.innerHTML='<div class="verdict">Couldn\'t check just now — compare with the example.</div>'; return; }
        out.innerHTML=`<div class="verdict ${v.done===2?'ok':v.done===0?'no':''}">${DONE[v.done]}</div>`+
          `<div class="verdict ${v.grammarOk?'ok':'no'}">${v.grammarOk?'Grammar: no mistakes spotted ✓':'Grammar: check this — '+esc(v.why)}</div>`;
      });
    }));
    btns.push(button('Show an example',()=>{body.querySelector('#ex').classList.remove('hide');say(exAr,exa)},true));
    btns.push(button(i<prompts.length-1?'Next task':'Finish',()=>{i++;show()},!judge));
    screen(body,btns);
  };
  show();
}

function finish(p, step){
  RafiqPath.complete(p.n, step.key);
  setBar(1,1);
  const n=RafiqPath.next();
  const sameUnit=n.step&&n.unit.n===p.n;
  const s=RafiqPath.streak(), today=RafiqPath.doneToday();
  const body=el(`<div class="done"><div class="tick">✓</div><h2>${esc(step.title)} — done</h2>
    <p>${today>=RafiqPath.GOAL?'Daily goal reached. Anything more is a bonus.':'One more step and today\'s goal is done.'}</p>
    <span class="streak">🔥 ${s}-day streak</span></div>`);
  const btns=[];
  if(n.step) btns.push(button((sameUnit?'Next: ':'Next unit: ')+n.step.title,()=>{location.href='learn.html?u='+n.unit.n+'&s='+n.step.key}));
  btns.push(button('Back to home',()=>{location.href='dashboard.html'},!!n.step));
  screen(body,btns);
}

/* A real-life scene (?scene=id): Complete only, no path step. */
function runScene(sc){
  document.title=sc.en+' — Rafiq';
  runChat(null, null, {lines:sc.lines, title:sc.pic+' '+sc.en, situation:sc.en+' ('+sc.d+')', done:()=>{
    Progress.touch('x:'+sc.id); RafiqPath.markDay(); setBar(1,1);
    const body=el(`<div class="done"><div class="tick">${sc.pic}</div><h2>${esc(sc.en)} — done</h2>
      <p>Try it again another day with different replies — the more ways you can say it, the better.</p>
      <span class="streak">🔥 ${RafiqPath.streak()}-day streak</span></div>`);
    screen(body,[button('More scenes',()=>{location.href='practise.html#scenes'}),button('Back to home',()=>{location.href='dashboard.html'},true)]);
  }});
}

(async function(){
  if(typeof requireLogin==='function') requireLogin();
  await Progress.init();
  const scene=qs.get('scene')&&typeof SCENES!=='undefined'&&SCENES.find(s=>s.id===qs.get('scene'));
  if(scene) return runScene(scene);
  let p=RafiqPath.units().find(x=>x.n===qs.get('u'))||RafiqPath.next().unit;
  // A locked unit or step (someone typed the address, or an old link) sends
  // you to where you actually are on the path.
  if(!RafiqPath.unitOpen(p.n)) p=RafiqPath.next().unit;
  const steps=RafiqPath.steps(p);
  let step=steps.find(s=>s.key===qs.get('s'))||steps.find(s=>!RafiqPath.stepDone(p.n,s.key))||steps[0];
  if(!RafiqPath.stepOpen(p.n,step.key)) step=steps.find(s=>RafiqPath.stepOpen(p.n,s.key)&&!RafiqPath.stepDone(p.n,s.key))||steps[0];
  document.title=step.title+' — Rafiq';
  ({words:runWords,listen:runListen,grammar:runGrammar,practise:runPractise,speak:runSpeak,
    letters:runLetters,vowels:runVowels,chat:runChat})[step.kind](p,step);
})();
</script>
</body>
