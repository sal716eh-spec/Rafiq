.qar{font-family:var(--ar);font-size:26px;direction:rtl;text-align:right;line-height:1.95}
.qen{font-size:15px;margin:6px 0 0}
.big-ar{font-family:var(--ar);font-size:clamp(30px,7vw,44px);direction:rtl;text-align:center;line-height:1.7;padding:10px 0}

.opts{display:flex;gap:7px;flex-wrap:wrap;direction:rtl;margin-top:14px}

  border-radius:5px;padding:6px 14px;cursor:pointer;line-height:1.8;min-height:44px;display:inline-flex;align-items:center}
.opt.right{background:var(--verdigris);border-color:var(--verdigris);color:#fff}
.opt.wrong{background:var(--rubric);border-color:var(--rubric);color:#fff}
.why{font-size:12.5px;color:var(--ink-soft);margin-top:12px;border-left:2px solid var(--gold);padding-left:11px}
.good{font-family:var(--ar);font-size:24px;direction:rtl;text-align:right;line-height:1.9;color:var(--verdigris);cursor:pointer}
.vprompt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px;justify-content:center}
.vp-pron,.vp-verb{font-family:var(--ar);font-size:26px;direction:rtl;line-height:1.75}
.vp-tense{font-family:var(--ar);font-size:17px;direction:rtl;color:var(--rubric);background:var(--bg);
  border-radius:4px;padding:3px 10px;line-height:1.7}

input.ar-in{flex:1;min-width:200px;font-family:var(--ar);font-size:21px;line-height:1.7;direction:rtl;text-align:right;
  background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;color:var(--ink)}
.diff{font-family:var(--ar);font-size:21px;direction:rtl;text-align:right;line-height:1.95;margin-top:12px}
.diff .ok{color:var(--verdigris)} .diff .no{color:var(--rubric);text-decoration:line-through}
.score{font-family:var(--ut);font-size:11px;color:var(--ink-soft);margin-top:8px}
.rate{display:flex;gap:6px;margin-top:16px;align-items:center;flex-wrap:wrap}
.rb{font-family:var(--la);font-size:13px;border:1px solid var(--rule);background:var(--bg);border-radius:5px;
  padding:9px 18px;cursor:pointer;color:var(--ink);min-height:44px;flex:1 1 auto}

.nextrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nextrow a,.nextrow button{padding:12px 20px;border:1px solid var(--rule);border-radius:5px;background:var(--card);
  color:var(--ink);text-decoration:none;font-family:var(--la);font-size:14px;cursor:pointer}

@media (max-width:860px){

  .nextrow{flex-direction:column}.nextrow a,.nextrow button{width:100%;text-align:center}
}

<script>
DATA.forEach(u=>Object.assign(u,EXTRA[u.n]||{}));
const glue=(a,s)=>a+(s.startsWith('،')?'':' ')+s, joinAr=a=>a.reduce(glue);
const say=(t,el)=>RQ.speak(t,el);

/* ── progress: one Supabase-backed store for all four sections ── */
const ID={ word: w=>'v:'+w.id, drill: x=>'d:'+x.id };
// Verbs and joining words are self-service practice, not scheduled review —
// so they are not tracked in the shared store at all.

/* ── build a mixed queue across all four sections ── */
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const FIELD={transform:'transforms',cloze:'cloze',fix:'fix',build:'builds'};
function drillPool(){
  const out=[];
  DATA.forEach(u=>Object.keys(FIELD).forEach(m=>(u[FIELD[m]]||[]).forEach((d,i)=>
    out.push({kind:'sentences',mode:m,id:u.n+'|'+m+'|'+i,unit:u,d}))));
  DATA.forEach(u=>u.dialogue.forEach((line,i)=>
    out.push({kind:'sentences',mode:'produce',id:u.n+'|produce|'+i,unit:u,d:{ar:line[1],en:line[2]}})));
  return out;
}
function build(n){
  const share = k => Math.max(1, Math.round(n*k));

  // words: those due first, then unseen ones in book order
  const wDue = VOCAB.filter(w=>Progress.isDue(ID.word(w)));
  const wNew = VOCAB.filter(w=>Progress.isNew(ID.word(w)));
  const words = shuffle(wDue).slice(0, share(0.35))
    .concat(wNew.slice(0, Math.max(0, share(0.35)-wDue.length)))
    .map(w=>({kind:'words', mode:'word', w}));

  const dp   = drillPool();
  const dDue = dp.filter(x=>Progress.isDue(ID.drill(x)));
  const dNew = dp.filter(x=>Progress.isNew(ID.drill(x)));
  const sentences = shuffle(dDue).slice(0, share(0.35))
    .concat(shuffle(dNew).slice(0, Math.max(0, share(0.35)-dDue.length)));

  /* Verb patterns are scheduled per verb+tense; the pronoun is picked fresh
     each time so you meet the pattern, not a memorised single form. */
  const vPat=[];
  VERBS.forEach(v=>['past','pr','fut'].forEach(t=>vPat.push({v,t})));
  const verbs = shuffle(vPat).slice(0, share(0.15)).map(x=>{
    const p=Math.floor(Math.random()*PRONOUNS.length);
    const ans = x.t==='past' ? x.v.past[p] : x.t==='pr' ? x.v.pr[p] : 'سَ'+x.v.pr[p];
    return {kind:'verbs', mode:'verb', v:x.v, p, t:x.t, ans};
  });

  // connectors: scheduled by the connector itself, so the same trap resurfaces
  const links = shuffle(CONNECT_EX).slice(0, share(0.15))
    .map(t=>({kind:'links', mode:'link', d:t}));

  return shuffle(words.concat(sentences, verbs, links)).slice(0,n);
}

/* ── shared bits ── */
function norm(s){return (s||'').replace(/[\u064B-\u0652\u0670\u0640\u0653-\u0656]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه')
  .replace(/[^\u0621-\u064A\s]/g,' ').replace(/\s+/g,' ').trim()}
function lcs(t,s){const n=t.length,m=s.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=t[i-1]===s[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const mk=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(t[i-1]===s[j-1]){mk[i-1]=true;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}return mk}
function diffHTML(target,said){
  const orig=target.split(/\s+/).filter(Boolean), pairs=orig.map(w=>[w,norm(w)]).filter(p=>p[1]);
  const mk=lcs(pairs.map(p=>p[1]),norm(said).split(' ').filter(Boolean));
  return{html:pairs.map((p,i)=>`<span class="${mk[i]?'ok':'no'}">${p[0]}</span>`).join(' '),
         score:pairs.length?Math.round(100*mk.filter(Boolean).length/pairs.length):0}}
function tappable(el,t){el.style.cursor='pointer';el.onclick=()=>say(t,el);return el}
function taskBar(en,ar){const d=document.createElement('div');d.className='taskbar';
  d.innerHTML=`<span class="t-en">${en}</span>`+(ar?`<span class="t-ar">${ar}</span>`:'');return d}
function answerRow(target){
  const w=document.createElement('div'), row=document.createElement('div');row.className='ansrow';
  const inp=document.createElement('input');inp.className='ar-in';inp.dir='rtl';inp.placeholder='اكْتُبْ هُنا';
  const b=document.createElement('button');b.className='btn';b.textContent='Check';
  const out=document.createElement('div');
  const run=t=>{const{html,score}=diffHTML(target,t);
    out.innerHTML=`<div class="diff">${html}</div><div class="score">${score}% matched</div>`};
  b.onclick=()=>run(inp.value); inp.onkeydown=e=>{if(e.key==='Enter')run(inp.value)};
  row.appendChild(inp);row.appendChild(b);w.appendChild(row);w.appendChild(out);return w}

/* ── session ── */
const LEN=(()=>{const v=parseInt(new URLSearchParams(location.search).get('n'),10);return [8,12,20].includes(v)?v:12})();
let Q=[], pos=0, tally={again:0,good:0,easy:0};
const panel=document.getElementById('panel');
document.getElementById('quit').onclick=()=>{pos=Q.length;render()};

/* Verbs and joining words are practice, not scheduled review — so they get a
   plain "next" rather than a rating that would go nowhere. */
function nextRow(){
  const d=document.createElement('div');d.className='rate';
  const b=document.createElement('button');b.className='rb';b.textContent='Next →';
  b.onclick=()=>{setTimeout(()=>{pos++;render();window.scrollTo(0,0)},120)};
  d.appendChild(b);return d;
}
function rateRow(onPick){
  const d=document.createElement('div');d.className='rate';
  [['again','Again'],['good','Good'],['easy','Easy']].forEach(([q,l])=>{
    const b=document.createElement('button');b.className='rb';b.textContent=l;
    b.onclick=()=>{tally[q]++;onPick(q);setTimeout(()=>{pos++;render();window.scrollTo(0,0)},220)};
    d.appendChild(b)});
  return d}

const LABEL={words:'Words',sentences:'Sentences',verbs:'Verbs',links:'Joining words'};
function render(){
  RQ.stop(); panel.innerHTML='';
  document.getElementById('bar').style.width=Math.round(100*pos/Q.length)+'%';
  document.getElementById('count').textContent=Math.min(pos+1,Q.length)+' / '+Q.length;
  if(pos>=Q.length) return finish();
  const it=Q[pos];
  const from=document.createElement('div');from.className='sess-from';
  from.innerHTML=`<span class="pill ${it.kind}">${LABEL[it.kind]}</span>`+
                 (it.unit?`<span>Unit ${it.unit.n} · ${it.unit.en}</span>`:'');
  panel.appendChild(from);
  ({word:vWord,verb:vVerb,link:vLink}[it.mode]||vDrill)(it);
}
function finish(){
  document.getElementById('count').textContent=Q.length+' / '+Q.length;
  document.getElementById('bar').style.width='100%';
  const n=tally.again+tally.good+tally.easy;
  panel.innerHTML=`<div class="done"><div class="big">أَحْسَنْت</div><h2>Session complete</h2>
    <p>${n} item${n===1?'':'s'} practised across the four sections.</p>
    <div class="tally"><div><b>${tally.easy}</b>easy</div><div><b>${tally.good}</b>good</div><div><b>${tally.again}</b>again</div></div>
    <div class="nextrow"><a class="primary" href="session.html?n=${LEN}">Another session</a>
    <a href="dashboard.html">Back to home</a>
    <button class="logout-link" type="button">Sign out</button></div></div>`;
}

function vWord(it){
  const c=document.createElement('div');c.className='card';
  c.appendChild(taskBar('Say the meaning, then reveal','قُلِ الْمَعْنى ثُمَّ اكْشِفْ'));
  const ar=document.createElement('div');ar.className='big-ar';ar.textContent=it.w.ar;
  c.appendChild(tappable(ar,it.w.ar));
  const btn=document.createElement('button');btn.className='btn';btn.textContent='Reveal';btn.style.width='100%';
  const rev=document.createElement('div');rev.className='reveal';rev.style.display='none';
  rev.innerHTML=`<div class="en">${it.w.en}</div><div class="tr">${it.w.tr}</div>`;
  btn.onclick=()=>{rev.style.display='block';btn.style.display='none';say(it.w.ar,ar);
    c.appendChild(rateRow(q=>Progress.grade(ID.word(it.w),q)))};
  c.appendChild(btn);c.appendChild(rev);panel.appendChild(c);
}
function vVerb(it){
  const c=document.createElement('div');c.className='card';
  c.appendChild(taskBar('Give the '+(it.t==='past'?'past':it.t==='pr'?'present':'future')+' form','صَرِّفِ الْفِعْلَ'));
  c.insertAdjacentHTML('beforeend',`<div class="vprompt"><span class="vp-pron">${PRONOUNS[it.p].ar}</span>
    <span>+</span><span class="vp-verb">${it.v.ar}</span>
    <span class="vp-tense">${it.t==='past'?'الماضي':it.t==='pr'?'المضارع':'المستقبل'}</span></div>`);
  c.appendChild(answerRow(it.ans));
  const btn=document.createElement('button');btn.className='btn';btn.textContent='Show the answer';
  btn.style.cssText='width:100%;margin-top:12px';
  const box=document.createElement('div');box.style.display='none';
  const g=document.createElement('div');g.className='good';g.style.textAlign='center';g.textContent=it.ans;
  box.appendChild(tappable(g,it.ans));
  btn.onclick=()=>{box.style.display='block';btn.style.display='none';say(it.ans,g);
    c.appendChild(nextRow())};
  c.appendChild(btn);c.appendChild(box);panel.appendChild(c);
}
function vLink(it){
  const t=it.d,c=document.createElement('div');c.className='card';
  c.appendChild(taskBar('Choose the joining word','اخْتَرِ الرَّابِطَ الْمُناسِبَ'));
  const q=document.createElement('div');q.className='qar';
  const draw=f=>{q.innerHTML=t.q.replace('___',`<span class="gap${f?' filled':''}">${f||'___'}</span>`)};
  draw(null);c.appendChild(q);
  const ob=document.createElement('div');ob.className='opts';
  const why=document.createElement('div');why.className='why';why.style.display='none';why.textContent=t.w;
  t.o.forEach((o,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=()=>{if(c.dataset.done)return;c.dataset.done='1';
      const ok=j===t.a;b.classList.add(ok?'right':'wrong');
      if(!ok)ob.children[t.a].classList.add('right');
      draw(t.o[t.a]);why.style.display='block';say(t.q.replace('___',t.o[t.a]),q);
      c.appendChild(nextRow())};
    ob.appendChild(b)});
  c.appendChild(ob);c.appendChild(why);panel.appendChild(c);
}
function vDrill(it){
  const c=document.createElement('div');c.className='card';
  const d=it.d;
  if(it.mode==='cloze'){
    c.appendChild(taskBar('Choose the word that fits','اخْتَرِ الْكَلِمَةَ الْمُناسِبَةَ'));
    const q=document.createElement('div');q.className='qar';
    const draw=f=>{q.innerHTML=d.q.replace('___',`<span class="gap${f?' filled':''}">${f||'___'}</span>`)};
    draw(null);c.appendChild(q);
    const ob=document.createElement('div');ob.className='opts';
    const why=document.createElement('div');why.className='why';why.style.display='none';why.textContent=d.w;
    d.o.forEach((o,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=()=>{if(c.dataset.done)return;c.dataset.done='1';
        const ok=j===d.a;b.classList.add(ok?'right':'wrong');
        if(!ok)ob.children[d.a].classList.add('right');
        draw(d.o[d.a]);why.style.display='block';say(d.q.replace('___',d.o[d.a]),q);
        c.appendChild(rateRow(q2=>Progress.grade(ID.drill(it),q2)))};
      ob.appendChild(b)});
    c.appendChild(ob);c.appendChild(why);
  } else if(it.mode==='fix'){
    c.appendChild(taskBar('Find the mistake and correct it','صَحِّحِ الْخَطَأَ'));
    const bad=document.createElement('div');bad.className='qar';bad.style.color='var(--rubric)';bad.textContent=d.bad;
    c.appendChild(bad);
    const btn=document.createElement('button');btn.className='btn';btn.textContent='Check';btn.style.cssText='width:100%;margin-top:14px';
    const box=document.createElement('div');box.style.display='none';
    const g=document.createElement('div');g.className='good';g.textContent=d.good;box.appendChild(tappable(g,d.good));
    const w=document.createElement('div');w.className='why';w.textContent=d.w;box.appendChild(w);
    btn.onclick=()=>{box.style.display='block';btn.style.display='none';say(d.good,g);
      c.appendChild(rateRow(q=>Progress.grade(ID.drill(it),q)))};
    c.appendChild(btn);c.appendChild(box);
  } else if(it.mode==='transform'){
    c.appendChild(taskBar(d.task[1],d.task[0]));
    const src=document.createElement('div');src.className='qar';src.textContent=d.src;
    c.appendChild(tappable(src,d.src));
    const btn=document.createElement('button');btn.className='btn';btn.textContent='Check';btn.style.cssText='width:100%;margin-top:14px';
    const box=document.createElement('div');box.style.display='none';
    const g=document.createElement('div');g.className='good';g.textContent=d.ans;box.appendChild(tappable(g,d.ans));
    btn.onclick=()=>{box.style.display='block';btn.style.display='none';say(d.ans,g);
      c.appendChild(rateRow(q=>Progress.grade(ID.drill(it),q)))};
    c.appendChild(btn);c.appendChild(box);
  } else if(it.mode==='build'){
    c.appendChild(taskBar('Say this in Arabic','قُلْها بِالْعَرَبِيَّةِ'));
    c.insertAdjacentHTML('beforeend',`<div class="qen">${d.en}</div>`);
    const target=joinAr(d.parts);
    c.appendChild(answerRow(target));
    const btn=document.createElement('button');btn.className='btn';btn.textContent='Show the answer';btn.style.cssText='width:100%;margin-top:12px';
    const box=document.createElement('div');box.style.display='none';
    const g=document.createElement('div');g.className='good';g.textContent=target;box.appendChild(tappable(g,target));
    btn.onclick=()=>{box.style.display='block';btn.style.display='none';say(target,g);
      c.appendChild(rateRow(q=>Progress.grade(ID.drill(it),q)))};
    c.appendChild(btn);c.appendChild(box);
  } else {                                   // produce
    c.appendChild(taskBar('Say this in Arabic','قُلْها بِالْعَرَبِيَّةِ'));
    c.insertAdjacentHTML('beforeend',`<div class="qen">${d.en}</div>`);
    c.appendChild(answerRow(d.ar));
    const btn=document.createElement('button');btn.className='btn';btn.textContent='Show the answer';btn.style.cssText='width:100%;margin-top:12px';
    const box=document.createElement('div');box.style.display='none';
    const g=document.createElement('div');g.className='good';g.textContent=d.ar;box.appendChild(tappable(g,d.ar));
    btn.onclick=()=>{box.style.display='block';btn.style.display='none';say(d.ar,g);
      c.appendChild(rateRow(q=>Progress.grade(ID.drill(it),q)))};
    c.appendChild(btn);c.appendChild(box);
  }
  panel.appendChild(c);
}
Progress.init().then(()=>{ Q=build(LEN); render(); });
</script>
