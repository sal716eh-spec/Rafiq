# Cloudflare Worker that checks typed answers (worker/src/index.js).
# Lives at the repo root so the Cloudflare build needs no root-directory setting.
name = "rafiq-judge"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

# The TypeSafe key is a secret, never in this file:
#   Cloudflare dashboard → Workers → rafiq-judge → Settings → Variables and Secrets
#   → add secret TYPESAFE_API_KEY
