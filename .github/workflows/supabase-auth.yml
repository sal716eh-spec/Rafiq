name: Supabase auth settings

on:
  workflow_dispatch:
    inputs:
      command:
        description: "show (read only) | apply"
        required: true
        default: "show"
      confirm_email:
        description: "apply only: turn 'Confirm email' on (yes), off (no) or leave it (keep)"
        required: false
        default: "keep"
      templates_ref:
        description: "apply only: branch to take supabase/email-templates from"
        required: false
        default: "main"
      sender:
        description: "apply only: the From address (must be on the verified Resend domain)"
        required: false
        default: "hello@contact.rafiq-arabic.com"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.templates_ref }}
          path: templates-src
          sparse-checkout: supabase/email-templates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONFIRM: ${{ inputs.confirm_email }}
          SENDER: ${{ inputs.sender }}
          TEMPLATES: templates-src/supabase/email-templates
          CMD: ${{ inputs.command }}
        run: node tools/supabase-auth.js "$CMD"
