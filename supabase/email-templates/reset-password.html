<!-- Supabase → Authentication → Emails → "Reset password". Subject: Reset your Rafiq password -->

  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E2DACB;border-radius:6px">
