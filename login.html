<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){
  if (location.hostname === 'sal716eh-spec.github.io') {
    var path = location.pathname.replace(/^\/Rafiq/, '') || '/';
    location.replace('https://rafiq-arabic.com' + path + location.search + location.hash);

<script src="theme.js?v=2"></script>
<title>Rafiq — your Arabic pal</title>

<style>
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.wordmark{display:flex;align-items:center;justify-content:center;gap:14px}
.word{font-family:var(--ar);direction:rtl;font-size:clamp(38px,8.5vw,58px);font-weight:600;line-height:1.6;padding:6px 0}
/* the ر monogram, same mark as the nav on every other page */
.mark{position:relative;flex:0 0 auto;width:clamp(46px,10vw,64px);height:clamp(46px,10vw,64px);
  border-radius:clamp(12px,2.6vw,16px);background:var(--ink);display:inline-block}
.mark::before{content:'ر';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--ar);font-size:clamp(28px,6vw,40px);line-height:1;color:var(--paper);padding-bottom:5px}
.mark::after{content:'';position:absolute;top:clamp(8px,1.8vw,11px);right:clamp(8px,1.8vw,11px);
  width:clamp(7px,1.5vw,9px);height:clamp(7px,1.5vw,9px);border-radius:50%;background:var(--rubric)}
.word span{color:var(--rubric)}
.sub{font-family:var(--ar);direction:rtl;font-size:clamp(16px,3.4vw,21px);line-height:1.75;color:var(--verdigris);margin-top:12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:32px 36px;margin-top:38px;width:min(380px,100%);text-align:left}
.card .label{margin-bottom:20px;text-align:center}
.field{margin-bottom:16px}
.field label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:5px}
.field input{width:100%;border:1px solid var(--rule);border-radius:3px;background:var(--paper);height:40px;padding:0 12px;font-family:var(--la);font-size:16px;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--verdigris)}
.toggle a{transition:opacity .12s}
.toggle a:active{opacity:.6}
.card .btn{width:100%;margin-top:6px}
.note{margin-top:16px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.5}
.msg{margin-top:14px;font-size:13px;text-align:center;line-height:1.5;display:none}
.msg.show{display:block}
.msg.err{color:var(--rubric)}
.msg.ok{color:var(--verdigris)}
.toggle{margin-top:18px;text-align:center;font-size:13px;color:var(--ink-soft)}
.toggle a{color:var(--verdigris);cursor:pointer;text-decoration:underline}
#nameField{display:none}
.card.signup #nameField{display:block}
.card.reset #pwField{display:none}
.forgot{display:block;text-align:right;margin-top:6px;font-size:12px;color:var(--verdigris);cursor:pointer;text-decoration:underline}
.card.signup .forgot,.card.reset .forgot{display:none}
.msg a{color:var(--verdigris);cursor:pointer;text-decoration:underline}
.btn[disabled]{opacity:.6;cursor:default}
</style>
</head>
<body>
<main class="screen">
  <div class="wordmark">
    <span class="mark" aria-hidden="true"></span>
    <span class="word">رَفِيق</span>
  </div>
  <div class="sub">رَفِيقُكَ فِي تَعَلُّمِ الْعَرَبِيَّةِ</div>
  <form class="card" id="authForm">
    <div class="label" id="formTitle">Sign in to continue</div>
    <div class="field" id="nameField"><label for="nm">Your name</label><input id="nm" type="text" placeholder="What should we call you?" autocomplete="given-name"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
    <div class="field" id="pwField"><label for="pw">Password</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required><a class="forgot" id="forgotLink">Forgot password?</a></div>
    <button class="btn" type="submit" id="submitBtn">Sign in</button>
    <div class="msg" id="msg"></div>
    <div class="toggle" id="toggle">New here? <a data-mode="signup">Create an account</a></div>
  </form>
</main>

<!-- Supabase client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// --- your project's SAFE public values ---
const SUPABASE_URL = 'https://gaajfahtrbdybjuunfhe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nFs-UJyKpTsCtHRn4WZJGg_c14-cM4e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mode = 'signin'; // or 'signup' or 'reset'
const form   = document.getElementById('authForm');
const card   = form;
const title  = document.getElementById('formTitle');
const btn    = document.getElementById('submitBtn');
const toggle = document.getElementById('toggle');
const msgEl  = document.getElementById('msg');
const pwEl   = document.getElementById('pw');

const pageUrl = (name) => new URL(name, location.href).href;
const BTN_TEXT = { signin: 'Sign in', signup: 'Create account', reset: 'Send reset link' };

// Supabase sends auth-link errors back in the hash (implicit flow) or the query (PKCE)
function linkError(){
  const p = new URLSearchParams(location.hash.slice(1));
  const q = new URLSearchParams(location.search);
  const code = p.get('error_code') || q.get('error_code') || p.get('error') || q.get('error');
  if (!code) return null;
  history.replaceState(null, '', location.pathname);
  if (code === 'otp_expired') return 'That link has expired or was already used. Sign in below — if your email still isn’t confirmed, we’ll offer to send a new link.';
  return 'That link didn’t work. Please try signing in, or ask for a new link.';
}

// If already logged in (including arriving from a confirmation link), skip to the dashboard
(async () => {
  const err = linkError();
  if (err) { showMsg(err); return; }
  const { data } = await sb.auth.getSession();
  if (data && data.session) window.location.href = 'dashboard.html';
})();

function setMode(m, keepMsg){
  mode = m;
  card.classList.toggle('signup', m === 'signup');
  card.classList.toggle('reset', m === 'reset');
  btn.textContent = BTN_TEXT[m];
  pwEl.required = m !== 'reset';
  if(m==='signup'){
    title.textContent = 'Create your account';
    toggle.innerHTML = 'Already have an account? <a data-mode="signin">Sign in</a>';
    pwEl.setAttribute('autocomplete','new-password');
  } else if(m==='reset'){
    title.textContent = 'Reset your password';
    toggle.innerHTML = 'Remembered it? <a data-mode="signin">Sign in</a>';
  } else {
    title.textContent = 'Sign in to continue';
    toggle.innerHTML = 'New here? <a data-mode="signup">Create an account</a>';
    pwEl.setAttribute('autocomplete','current-password');
  }
  if(!keepMsg) showMsg('');
}

// event delegation: one listener handles the links however often the HTML is rewritten
toggle.addEventListener('click', (e)=>{
  const a = e.target.closest('[data-mode]');
  if(a) setMode(a.dataset.mode);
});
document.getElementById('forgotLink').addEventListener('click', ()=> setMode('reset'));

if (new URLSearchParams(location.search).get('mode') === 'reset') setMode('reset');

function showMsg(text, kind){
  msgEl.textContent = text || '';
  msgEl.className = 'msg' + (text ? ' show '+(kind||'err') : '');
}

// unconfirmed email: explain, and offer to send the confirmation email again
function showUnconfirmed(email){
  showMsg('Your email isn’t confirmed yet. Check your inbox (and spam) for the link. ');
  const a = document.createElement('a');
  a.textContent = 'Send it again';
  a.addEventListener('click', async ()=>{
    a.remove();
    const { error } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: pageUrl('login.html') } });
    if(error) showMsg(friendly(error));
    else showMsg('Sent — check your inbox for a new confirmation link.', 'ok');
  });
  msgEl.appendChild(a);
}

// friendlier wording for the common Supabase errors
function friendly(err){
  const m = (err && err.message || '').toLowerCase();
  if(m.includes('invalid login')) return 'That email and password don’t match. Try again, or use “Forgot password?”.';
  if(m.includes('already registered')||m.includes('already been registered')) return 'That email already has an account. Try signing in instead.';
  if(m.includes('password should be at least')) return 'Password is too short — use at least 6 characters.';
  if(m.includes('unable to validate email')||m.includes('invalid email')) return 'That email doesn’t look right — please check it.';
  if(m.includes('rate limit')||m.includes('security purposes')) return 'Too many emails sent just now. Please wait a minute and try again.';
  return err && err.message ? err.message : 'Something went wrong. Please try again.';
}

function done(){ btn.disabled = false; btn.textContent = BTN_TEXT[mode]; }

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const pw    = pwEl.value;
  const name  = (document.getElementById('nm').value||'').trim();
  if(!email){ showMsg('Please enter your email.'); return; }
  if(mode!=='reset' && !pw){ showMsg('Please enter your email and password.'); return; }

  btn.disabled = true;
  showMsg('');

  try {
    if(mode==='reset'){
      btn.textContent = 'Sending…';
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl('reset-password.html') });
      if(error){ showMsg(friendly(error)); done(); return; }
      // same message whether or not the account exists, so emails can't be probed
      showMsg('If that email has an account, a reset link is on its way. Check your inbox (and spam).', 'ok');
      done();
    } else if(mode==='signup'){
      btn.textContent = 'Creating…';
      const { data, error } = await sb.auth.signUp({
        email, password: pw,
        options: { data: { name: name || null }, emailRedirectTo: pageUrl('login.html') }
      });
      if(error){ showMsg(friendly(error)); done(); return; }
      // If email confirmation is OFF, a session exists now → go straight in.
      if(data.session){
        try{ if(name) localStorage.setItem('bay_name', name); }catch(_){}
        window.location.href = 'dashboard.html';
      } else {
        setMode('signin', true);
        showMsg('Account created — we’ve emailed you a link to confirm your address. Click it, then you’re in.', 'ok');
        done();
      }
    } else {
      btn.textContent = 'Signing in…';
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if(error){
        if((error.message||'').toLowerCase().includes('email not confirmed')) showUnconfirmed(email);
        else showMsg(friendly(error));
        done(); return;
      }
      // keep the display name handy for the dashboard greeting
      const nm = (data.user && data.user.user_metadata && data.user.user_metadata.name) || '';
      try{ if(nm) localStorage.setItem('bay_name', nm); }catch(_){}
      // reset auth.js's idle clock so a stale timestamp can't log a fresh sign-in straight out
      try{ localStorage.setItem('bay_last_active', String(Date.now())); }catch(_){}
      window.location.href = 'dashboard.html';
    }
  } catch(err){
    showMsg(friendly(err)); done();
  }
});
</script>
</body>
</html>
